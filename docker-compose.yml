version: '3.8'

services:
  web:
    build: .
    container_name: edoc_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=edoc_user
      - DB_PASSWORD=edoc_pass
      - DB_NAME=edoc_local

  db:
    image: mysql:8.0
    container_name: edoc_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: edoc_local
      MYSQL_USER: edoc_user
      MYSQL_PASSWORD: edoc_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin
    container_name: edoc_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db

volumes:
  db_data:
